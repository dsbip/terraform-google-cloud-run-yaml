# yaml-language-server: $schema=../../schemas/cloud-run-config.schema.json
#
# GPU workloads: an inference service and a batch fine-tuning job on NVIDIA
# L4 GPUs. A GPU needs the node_selector, a "nvidia.com/gpu" limit, CPU that
# is always allocated (services) and enough CPU and memory.

defaults:
  region: us-central1      # a region with Cloud Run GPUs

services:
  llm-inference:
    description: Open model served with vLLM on one L4 GPU.
    deletion_protection: false
    template:
      gpu_zonal_redundancy_disabled: true    # cheaper, no zonal failover
      max_instance_request_concurrency: 8
      timeout: 600s
      scaling:
        min_instance_count: 0
        max_instance_count: 3
      node_selector:
        accelerator: nvidia-l4
      containers:
        - image: us-docker.pkg.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve:latest
          args: [--model=google/gemma-2-2b-it, --max-model-len=4096]
          ports: { container_port: 8000 }
          resources:
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            cpu_idle: false
            startup_cpu_boost: true
          secret_env:
            HF_TOKEN: { secret: huggingface-token }
          startup_probe:
            tcp_socket: { port: 8000 }
            initial_delay_seconds: 60
            period_seconds: 10
            failure_threshold: 30
    invokers:
      - serviceAccount:chat-backend@${project_id}.iam.gserviceaccount.com

jobs:
  fine-tune:
    deletion_protection: false
    template:
      gpu_zonal_redundancy_disabled: true
      timeout: 21600s
      max_retries: 1
      node_selector:
        accelerator: nvidia-l4
      containers:
        - image: ${registry}/fine-tune:0.3.0
          args: ["--dataset=gs://${project_id}-datasets/support-tickets"]
          resources:
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
