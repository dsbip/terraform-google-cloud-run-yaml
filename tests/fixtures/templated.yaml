# Rendered with templatefile(): env and tag come from template_vars,
# project_id and region from the module's variables.
defaults:
  region: ${region}
  labels:
    environment: ${env}
  services:
    deletion_protection: false

services:
  api-${env}:
    description: API ${tag} in ${project_id}
    template:
      containers:
        - image: europe-docker.pkg.dev/${project_id}/app/api:${tag}
%{ if env == "prod" ~}
      scaling:
        min_instance_count: 2
%{ endif ~}
  literal:
    enabled: ${env == "prod"}
    description: "Costs $${price}"
    template:
      containers:
        - image: us-docker.pkg.dev/cloudrun/container/hello

jobs:
  batch-${env}:
    template:
      task_count: '${env == "prod" ? 10 : 1}'
      containers:
        - image: us-docker.pkg.dev/cloudrun/container/job
